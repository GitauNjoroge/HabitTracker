[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habittracker"
version = "1.0.0"
description = "A command-line tracker for daily and weekly habits."
requires-python = ">=3.9"
dependencies = ["click>=8.0"]

[project.scripts]
habittracker = "src.main:cli"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
